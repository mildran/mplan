<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<th:block layout:fragment="content">
  <h1 class="panel-titulo">Autorizaciones pendientes</h1>

  <p th:if="${#lists.isEmpty(pendientes)}" class="mensaje success-msg">No hay registros pendientes de autorización.</p>

  <table class="tabla-usuarios" th:unless="${#lists.isEmpty(pendientes)}">
    <thead>
    <tr>
      <th>Usuario</th>
      <th>Email</th>
      <th>Nombre</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${pendientes}">
      <td th:text="${u.usuario}"></td>
      <td th:text="${u.email}"></td>
      <td th:text="${u.nombre} + ' ' + ${u.apellido}"></td>
      <td>
        <div style="display:flex; gap:0.5rem;">
          <form th:action="@{'/gestionar/autorizaciones/' + ${u.id} + '/autorizar'}" method="post">
            <button type="submit" class="cta-button btn-small">Autorizar</button>
          </form>
          <form th:action="@{'/gestionar/autorizaciones/' + ${u.id} + '/rechazar'}" method="post" onsubmit="return confirm('¿Seguro que quieres rechazar este registro? Se borrará al usuario.');">
            <button type="submit" class="cta-button btn-small btn-danger">No autorizar</button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</th:block>
</body>
</html>
