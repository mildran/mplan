<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true">
      <rect x="2" y="18" width="6" height="14" rx="1.5" fill="#C9A961"/>
      <rect x="14" y="10" width="6" height="22" rx="1.5" fill="#E8E1D3"/>
      <rect x="26" y="2" width="6" height="30" rx="1.5" fill="#C9A961"/>
    </svg>
    <span class="logo-text">Mplan<span class="logo-dot">.</span></span>
  </div>
  <ul class="nav-links">
    <li><a href="/">Inicio</a></li>
    <li sec:authorize="hasRole('ADMINISTRADOR')" class="nav-dropdown">
      <span class="nav-dropdown-trigger">Gestionar</span>
      <ul class="nav-dropdown-menu">
        <li><a href="/gestionar">Gestión de usuarios</a></li>
        <li><a href="/gestionar/autorizaciones">Autorizaciones pendientes (<span th:text="${@usuarioRepository.countByAprobadoFalse()}">0</span>)</a></li>
      </ul>
    </li>
    <li sec:authorize="isAnonymous()"><a href="/login">Iniciar sesión</a></li>
    <li sec:authorize="isAnonymous()"><a href="/registro">Crear cuenta</a></li>
    <li sec:authorize="isAuthenticated()" class="nav-dropdown">
      <span class="nav-dropdown-trigger nav-user">@<span sec:authentication="name">usuario</span></span>
      <ul class="nav-dropdown-menu">
        <li><a href="/perfil">Mis datos</a></li>
      </ul>
    </li>
    <li sec:authorize="isAuthenticated()">
      <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="logout-link">Cerrar sesión</button>
      </form>
    </li>
  </ul>
</nav>
</body>
</html>
