<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<th:block layout:fragment="content">
  <h1>Iniciar sesión</h1>

  <p th:if="${param.error}" class="error-msg">Usuario o contraseña incorrectos.</p>
  <p th:if="${param.registrado}" class="error-msg" style="color:#4CAF50;background:rgba(76,175,80,0.15);">Cuenta creada. Ya puedes iniciar sesión.</p>
  <p th:if="${param.logout}" class="error-msg" style="color:#4CAF50;background:rgba(76,175,80,0.15);">Sesión cerrada correctamente.</p>

  <form th:action="@{/login}" method="post" class="form-box">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div class="form-check">
      <input type="checkbox" id="remember-me" name="remember-me">
      <label for="remember-me">Recuérdame</label>
    </div>

    <button type="submit" class="cta-button">Entrar</button>
  </form>

  <p class="form-links">
    <a href="/registro">Crear cuenta</a> · <a href="/recuperar">¿Olvidaste tu contraseña?</a>
  </p>
</th:block>
</body>
</html>
