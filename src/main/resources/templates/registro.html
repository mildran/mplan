<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<th:block layout:fragment="content">
    <h1>Crear cuenta</h1>
    <form th:action="@{/registro}" th:object="${registroForm}" method="post" class="form-box">
        <p th:if="${error}" th:text="${error}" class="error-msg"></p>

        <div class="form-group">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" th:field="*{usuario}" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" th:field="*{apellido}">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" required>
        </div>

        <div class="form-group">
            <label for="confirmarPassword">Confirmar contraseña</label>
            <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}" required>
        </div>

        <button type="submit" class="cta-button">Crear cuenta</button>
    </form>
</th:block>
</body>
</html>
