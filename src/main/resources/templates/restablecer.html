<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<th:block layout:fragment="content">
    <h1>Nueva contraseña</h1>

    <p th:if="${error}" th:text="${error}" class="mensaje error-msg"></p>

    <form th:action="@{/recuperar/restablecer}" method="post" class="form-box">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="confirmarPassword">Confirmar contraseña</label>
            <input type="password" id="confirmarPassword" name="confirmarPassword" required>
        </div>

        <button type="submit" class="cta-button">Cambiar contraseña</button>
    </form>
</th:block>
</body>
</html>
